<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="UTF-8">
    <title>Javatari</title>
    <meta name="description" content="Javatari - The online Atari 2600 emulator">
    <style>
        html, body { margin: 0; height: 100%; background: #000; }
    </style>
</head>

<body>

    <div id="javatari" style="text-align: center; margin: 20px auto 0; padding: 0 10px;">
        <div id="javatari-screen" style="box-shadow: 2px 2px 10px rgba(0, 0, 0, .7);"></div>
    </div>

    <script src="gamepad-support.js"></script>
    <script src="javatari.js"></script>
    <script>
        Javatari.CARTRIDGE_CHANGE_DISABLED = true
        Javatari.CARTRIDGE_SHOW_RECENT = false
        Javatari.CARTRIDGE_URL = new URLSearchParams(location.search).get('ROM')

        // ---- Teclas del jugador 2: W A S D + R ----
        // Javatari carga sus preferencias (y las teclas guardadas en el navegador)
        // justo al arrancar. Envolvemos esa carga para imponer siempre estas teclas.
        // Jugador 1 se queda por defecto: flechas + Espacio.
        const loadOriginal = Javatari.userPreferences.load
        Javatari.userPreferences.load = function () {
            loadOriginal.apply(this, arguments)
            const K = jt.DOMKeys
            const p2 = Javatari.userPreferences.current.joystickKeys[1]
            p2.up = K.VK_W
            p2.left = K.VK_A
            p2.down = K.VK_S
            p2.right = K.VK_D
            p2.button = K.VK_R
        }
    </script>

</body>

</html>
